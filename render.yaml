# One-click public demo on Render (https://render.com). See "Public demo" in the README.
services:
  - type: web
    name: genai-bank-governance-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GOVERNANCE_DEMO
        value: "1"
      - key: GOVERNANCE_DB_PATH
        value: /tmp/register.sqlite
