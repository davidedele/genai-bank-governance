name: Check plugin/classifier sync

# register.ts (the genai-usage-logger plugin's prompt) duplicates
# FORMS_OF_USE, DIMENSIONS, and the banking_process note from
# data/framework.py and classifier.py by hand, because its sandboxed
# TypeScript environment cannot import this project's Python modules. That
# already drifted out of sync once during development. This workflow runs
# scripts/check_plugin_sync.py on every push and PR that could cause that
# drift again, so it fails the build instead of shipping silently.

on:
  push:
    paths:
      - "classifier.py"
      - "data/framework.py"
      - "claude-plugin/genai-usage-logger/hooks/register.ts"
      - "scripts/check_plugin_sync.py"
  pull_request:
    paths:
      - "classifier.py"
      - "data/framework.py"
      - "claude-plugin/genai-usage-logger/hooks/register.ts"
      - "scripts/check_plugin_sync.py"

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/check_plugin_sync.py
